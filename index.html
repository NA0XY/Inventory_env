<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceProcessingEnv Benchmark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .log-container::-webkit-scrollbar { width: 6px; }
        .log-container::-webkit-scrollbar-track { background: transparent; }
        .log-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .log-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TASKS = [
            { id: "task_1", name: 'Task 1', tag: 'Extraction', desc: 'Fix OCR noise and extract 7 fields.' },
            { id: "task_2", name: 'Task 2', tag: 'Validation', desc: 'Verify quantities using Unit-of-Measure math.' },
            { id: "task_3", name: 'Task 3', tag: 'Fraud', desc: 'Batch review with Poison Pill distractors.' },
            { id: "task_4", name: 'Task 4', tag: 'GL Coding', desc: 'Map items to the Chart of Accounts.' },
            { id: "task_5", name: 'Task 5', tag: 'Reconciliation', desc: 'Cross-reference Statements vs Ledgers.' },
        ];

        const AUTOFILL_SCHEMAS = {
            'task_1': { invoice_id: "INV-2024-0041", extracted_fields: { vendor_name: "Apex Office Supplies Ltd.", invoice_number: "INV-2024-0041", invoice_date: "2024-03-15", line_items: [{}, {}, {}], subtotal: 1787.46, tax_amount: 151.93, total_amount: 1939.39 } },
            'task_2': { invoice_id: "INV-BSL-0112", decision: "reject", mismatches: ["quantity", "price", "total"] },
            'task_3': { invoice_id: "INV-1", fraud_flags: [{ invoice_id: "INV-2", reason: "amount mismatch" }, { invoice_id: "INV-4", reason: "unauthorized vendor" }, { invoice_id: "INV-5", reason: "duplicate" }] },
            'task_4': { invoice_id: "INV-GL-992", gl_allocations: { "Dell XPS 15 Laptop (Engineering)": "GL-6000", "GitHub Enterprise License (Annual)": "GL-6100", "Team Pizza Lunch (Q3 Kickoff)": "GL-5000", "Printer Ink Cartridges (Cyan/Magenta)": "GL-7000" } },
            'task_5': { invoice_id: "task5-batch", missing_invoices: ["INV-8003"], discrepancy_invoices: ["INV-8002"] }
        };

        function App() {
            const [view, setView] = useState('dashboard');
            const [selectedTask, setSelectedTask] = useState('task_1');
            const [actionInput, setActionInput] = useState('');
            const [logs, setLogs] = useState([]);
            const [isDone, setIsDone] = useState(false);
            const [loading, setLoading] = useState(false);
            const [customSetupInput, setCustomSetupInput] = useState("");
            const logsEndRef = useRef(null);

            useEffect(() => {
                logsEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [logs]);

            const startDemo = async () => {
                const customDataRaw = customSetupInput.trim();
                let parsedCustomData = null;

                if (customDataRaw) {
                    try {
                        parsedCustomData = JSON.parse(customDataRaw);
                    } catch (e) {
                        alert("Invalid JSON in Custom Environment Data. Please fix it before starting the demo.");
                        return;
                    }

                    if (parsedCustomData === null || Array.isArray(parsedCustomData) || typeof parsedCustomData !== "object") {
                        alert("Custom Environment Data must be a JSON object.");
                        return;
                    }
                }

                setView('demo');
                setLogs([{ type: 'system', message: `Initializing ${selectedTask}...` }]);
                setIsDone(false);
                setActionInput('');
                setLoading(true);

                try {
                    const resetRequest = { method: "POST" };
                    if (parsedCustomData !== null) {
                        resetRequest.headers = { "Content-Type": "application/json" };
                        resetRequest.body = JSON.stringify(parsedCustomData);
                    }

                    const res = await fetch(`/reset?task_id=${selectedTask}`, resetRequest);
                    if (!res.ok) throw new Error(await res.text());
                    const data = await res.json();

                    setLogs(prev => [
                        ...prev,
                        { type: 'system', message: `--- STARTED ${selectedTask.toUpperCase()} ---` },
                        { type: 'env', message: 'Initial Observation', data: data.observation }
                    ]);
                } catch (e) {
                    setLogs(prev => [...prev, { type: 'error', message: `Failed to reset: ${e.message}` }]);
                } finally {
                    setLoading(false);
                }
            };

            const submitAction = async () => {
                let parsedAction;
                try {
                    parsedAction = JSON.parse(actionInput);
                } catch (e) {
                    alert("Invalid JSON format! Please correct your payload before submitting.");
                    return;
                }

                setLogs(prev => [...prev, { type: 'agent', message: 'Action Submitted', data: parsedAction }]);
                setLoading(true);

                try {
                    const res = await fetch(`/step`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(parsedAction)
                    });

                    if (!res.ok) throw new Error(await res.text());
                    const data = await res.json();

                    setLogs(prev => [
                        ...prev,
                        { type: 'grader', message: `Reward: ${data.reward.value.toFixed(2)}`, success: data.reward.value > 0, data: data.reward },
                        { type: 'env', message: 'Next Observation', data: data.observation }
                    ]);

                    if (data.done) {
                        setIsDone(true);
                        setLogs(prev => [...prev, { type: 'system', message: `--- EPISODE DONE. Cumulative Reward: ${data.info.cumulative_reward.toFixed(2)} ---` }]);
                    }
                } catch (e) {
                    setLogs(prev => [...prev, { type: 'error', message: `Step failed: ${e.message}` }]);
                } finally {
                    setLoading(false);
                    setActionInput('');
                }
            };

            const autoFill = () => {
                if (AUTOFILL_SCHEMAS[selectedTask]) {
                    setActionInput(JSON.stringify(AUTOFILL_SCHEMAS[selectedTask], null, 2));
                }
            };

            const renderDashboard = () => (
                <div className="max-w-5xl mx-auto pt-12 px-6 pb-12 animate-fade-in">
                    <div className="bg-white border border-slate-200 rounded-2xl p-10 shadow-sm">
                        <div className="inline-flex items-center gap-2 px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-bold tracking-widest uppercase rounded-full mb-6 border border-indigo-100">
                            <i className="ph-fill ph-cube"></i> OpenEnv Benchmark
                        </div>
                        <h1 className="text-4xl font-extrabold text-slate-900 tracking-tight mb-4">InvoiceProcessingEnv</h1>
                        <p className="text-slate-500 text-lg mb-10 max-w-3xl leading-relaxed">
                            A 5-stage multi-turn simulation testing AI agents on OCR extraction, Unit-of-Measure math, fraud detection, GL account coding, and ledger reconciliation.
                        </p>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-10">
                            {TASKS.map((task) => (
                                <div key={task.id}
                                     onClick={() => setSelectedTask(task.id)}
                                     className={`cursor-pointer border rounded-xl p-6 transition-all duration-200 ${
                                         selectedTask === task.id
                                         ? 'bg-indigo-50/50 border-indigo-500 ring-1 ring-indigo-500 shadow-md transform -translate-y-0.5'
                                         : 'bg-white border-slate-200 hover:border-indigo-300 hover:shadow-sm hover:-translate-y-0.5'
                                     }`}>
                                    <div className="flex items-center gap-3 mb-3">
                                        <h3 className="text-lg font-bold text-slate-900">{task.name}</h3>
                                        <span className="px-2.5 py-0.5 bg-slate-100 text-slate-600 text-xs font-semibold rounded-md border border-slate-200">{task.tag}</span>
                                    </div>
                                    <p className="text-slate-600 text-sm leading-relaxed">{task.desc}</p>
                                </div>
                            ))}
                        </div>

                        <div className="mb-10 p-6 bg-slate-50 rounded-xl border border-slate-200">
                            <label htmlFor="custom-setup" className="flex items-center gap-2 text-sm font-bold text-slate-800 mb-2">
                                <i className="ph-duotone ph-sliders-horizontal text-indigo-500 text-lg"></i> Custom Environment Data (Optional)
                            </label>
                            <p className="text-slate-500 text-sm mb-4">
                                Paste a JSON object to override the default observation fields for the selected task. Leave blank to run the standard benchmark state.
                            </p>
                            <textarea
                                id="custom-setup"
                                className="w-full min-h-[120px] bg-white text-slate-800 font-mono text-sm p-4 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none resize-y transition-all shadow-sm"
                                placeholder={"{\n  \"invoice\": {\n    \"id\": \"INV-CUSTOM-1\",\n    \"raw_text\": \"Noisy OCR text here\",\n    \"metadata\": {}\n  }\n}"}
                                value={customSetupInput}
                                onChange={(e) => setCustomSetupInput(e.target.value)}
                            />
                        </div>

                        <div className="flex flex-wrap items-center gap-4 pt-4 border-t border-slate-100">
                            <button onClick={startDemo} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-semibold transition-all shadow-sm hover:shadow">
                                <i className="ph-fill ph-play-circle text-lg"></i> Run Interactive Demo
                            </button>
                            <a href="/docs" className="flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-6 py-3 rounded-xl font-semibold transition-all shadow-sm">
                                <i className="ph-duotone ph-file-text text-lg"></i> API Docs
                            </a>
                        </div>
                    </div>
                </div>
            );

            const renderDemo = () => (
                <div className="max-w-7xl mx-auto h-[95vh] flex flex-col my-4 bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-xl animate-fade-in">
                    <div className="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-slate-50/80 backdrop-blur-sm">
                        <div className="flex items-center gap-6">
                            <button onClick={() => setView('dashboard')} className="text-slate-500 hover:text-indigo-600 flex items-center gap-2 font-semibold transition-colors">
                                <i className="ph-bold ph-arrow-left"></i> Exit
                            </button>
                            <div className="h-6 w-px bg-slate-300"></div>
                            <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                <i className="ph-duotone ph-terminal-window text-indigo-500 text-xl"></i> {TASKS.find(t => t.id === selectedTask)?.name} Session
                            </h2>
                        </div>
                        <span className={`text-sm font-semibold px-3 py-1 rounded-full border ${isDone ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`}>
                            {isDone ? 'Episode Complete' : 'In Progress'}
                        </span>
                    </div>

                    <div className="flex flex-1 overflow-hidden">
                        <div className="flex-1 min-w-0 border-r border-slate-200 flex flex-col bg-slate-50/50">
                            <div className="p-4 border-b border-slate-200 bg-white text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-2 shrink-0">
                                <i className="ph-bold ph-activity text-slate-400"></i> Environment Log
                            </div>
                            <div className="flex-1 p-5 overflow-y-auto log-container font-mono text-sm space-y-4">
                                {logs.map((log, i) => {
                                    let containerClass = "p-4 rounded-xl border ";
                                    let icon = "";
                                    let textClass = "";

                                    if (log.type === 'system') {
                                        containerClass += "border-slate-200 bg-white shadow-sm";
                                        icon = <i className="ph-duotone ph-info text-slate-500"></i>;
                                        textClass = "text-slate-700 font-semibold";
                                    } else if (log.type === 'env') {
                                        containerClass += "border-blue-200 bg-blue-50/80";
                                        icon = <i className="ph-duotone ph-database text-blue-500"></i>;
                                        textClass = "text-blue-900 font-bold";
                                    } else if (log.type === 'agent') {
                                        containerClass += "border-purple-200 bg-purple-50/80";
                                        icon = <i className="ph-duotone ph-robot text-purple-500"></i>;
                                        textClass = "text-purple-900 font-bold";
                                    } else if (log.type === 'error') {
                                        containerClass += "border-rose-200 bg-rose-50/80";
                                        icon = <i className="ph-duotone ph-warning-circle text-rose-500"></i>;
                                        textClass = "text-rose-900 font-bold";
                                    } else if (log.type === 'grader') {
                                        if (log.success) {
                                            containerClass += "border-emerald-200 bg-emerald-50/80";
                                            icon = <i className="ph-duotone ph-check-circle text-emerald-600"></i>;
                                            textClass = "text-emerald-900 font-bold";
                                        } else {
                                            containerClass += "border-amber-200 bg-amber-50/80";
                                            icon = <i className="ph-duotone ph-warning text-amber-600"></i>;
                                            textClass = "text-amber-900 font-bold";
                                        }
                                    }

                                    return (
                                        <div key={i} className={containerClass}>
                                            <div className={`flex items-center gap-2 mb-2 ${textClass}`}>
                                                {icon} {log.message}
                                            </div>
                                            {log.data && (
                                                <pre className="mt-3 text-xs max-w-full overflow-x-auto whitespace-pre-wrap break-all p-4 bg-slate-900 text-slate-200 rounded-lg shadow-inner">
                                                    {JSON.stringify(log.data, null, 2)}
                                                </pre>
                                            )}
                                        </div>
                                    );
                                })}
                                <div ref={logsEndRef} />
                            </div>
                        </div>

                        <div className="w-[45%] flex-shrink-0 flex flex-col bg-white">
                            <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-white shrink-0">
                                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-2">
                                    <i className="ph-bold ph-code text-slate-400"></i> Action Payload
                                </span>
                                <button onClick={autoFill} disabled={isDone || loading}
                                        className="text-xs font-semibold flex items-center gap-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-md border border-indigo-200 transition-colors disabled:opacity-50">
                                    <i className="ph-bold ph-magic-wand"></i> Auto-fill Example
                                </button>
                            </div>

                            <div className="flex-1 p-5 flex flex-col gap-4 overflow-y-auto">
                                <p className="text-slate-500 text-sm">
                                    Construct the JSON payload your AI Agent would send to the <code>/step</code> endpoint based on the observation.
                                </p>
                                <textarea
                                    className="flex-1 w-full bg-slate-50 text-slate-800 font-mono text-sm p-4 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none resize-none shadow-inner transition-all"
                                    placeholder="{\n  // Enter JSON action here\n}"
                                    value={actionInput}
                                    onChange={(e) => setActionInput(e.target.value)}
                                    disabled={isDone || loading}
                                />

                                <button
                                    onClick={submitAction}
                                    disabled={!actionInput.trim() || isDone || loading}
                                    className="w-full shrink-0 flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400 text-white px-6 py-4 rounded-xl font-bold transition-all shadow-sm"
                                >
                                    {loading ? (
                                        <><i className="ph-bold ph-spinner animate-spin"></i> Processing...</>
                                    ) : (
                                        <><i className="ph-bold ph-paper-plane-right"></i> Send to Environment</>
                                    )}
                                </button>

                                {isDone && (
                                    <button onClick={startDemo} className="w-full shrink-0 flex items-center justify-center gap-2 bg-white hover:bg-slate-50 text-slate-700 px-6 py-3 rounded-xl font-semibold transition-all border border-slate-300 shadow-sm mt-2">
                                        <i className="ph-bold ph-arrow-counter-clockwise"></i> Restart Episode
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            return view === 'dashboard' ? renderDashboard() : renderDemo();
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
