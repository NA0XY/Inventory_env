<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceProcessingEnv Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #0B0F19; color: #f8fafc; font-family: system-ui, sans-serif; }
        .log-container::-webkit-scrollbar { width: 8px; }
        .log-container::-webkit-scrollbar-track { background: #111827; }
        .log-container::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TASKS = [
            { id: "task_1", name: "Task 1", tag: "Extraction", desc: "Fix OCR noise and extract 7 fields." },
            { id: "task_2", name: "Task 2", tag: "Validation", desc: "Verify quantities using Unit-of-Measure math." },
            { id: "task_3", name: "Task 3", tag: "Fraud", desc: "Batch review with Poison Pill distractors." },
            { id: "task_4", name: "Task 4", tag: "GL Coding", desc: "Map items to the Chart of Accounts." },
            { id: "task_5", name: "Task 5", tag: "Reconciliation", desc: "Cross-reference Statements vs Ledgers." },
        ];

        const AUTOFILL_SCHEMAS = {
            task_1: {
                invoice_id: "INV-2024-0041",
                extracted_fields: {
                    vendor_name: "Apex Office Supplies Ltd.",
                    invoice_number: "INV-2024-0041",
                    invoice_date: "2024-03-15",
                    line_items: [{}, {}, {}],
                    subtotal: 1787.46,
                    tax_amount: 151.93,
                    total_amount: 1939.39
                }
            },
            task_2: {
                invoice_id: "INV-BSL-0112",
                decision: "reject",
                mismatches: ["quantity", "price", "total"]
            },
            task_3: {
                invoice_id: "INV-1",
                fraud_flags: [
                    { invoice_id: "INV-2", reason: "amount mismatch" },
                    { invoice_id: "INV-4", reason: "unauthorized vendor" },
                    { invoice_id: "INV-5", reason: "duplicate" }
                ]
            },
            task_4: {
                invoice_id: "INV-GL-992",
                gl_allocations: {
                    "Dell XPS 15 Laptop (Engineering)": "GL-6000",
                    "GitHub Enterprise License (Annual)": "GL-6100",
                    "Team Pizza Lunch (Q3 Kickoff)": "GL-5000",
                    "Printer Ink Cartridges (Cyan/Magenta)": "GL-7000"
                }
            },
            task_5: {
                invoice_id: "task5-batch",
                missing_invoices: ["INV-8003"],
                discrepancy_invoices: ["INV-8002"]
            }
        };

        function App() {
            const [view, setView] = useState("dashboard");
            const [selectedTask, setSelectedTask] = useState("task_1");
            const [customSetupInput, setCustomSetupInput] = useState("");
            const [actionInput, setActionInput] = useState("");
            const [logs, setLogs] = useState([]);
            const [isDone, setIsDone] = useState(false);
            const [loading, setLoading] = useState(false);
            const logsEndRef = useRef(null);

            useEffect(() => {
                logsEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [logs]);

            const startDemo = async () => {
                const customDataRaw = customSetupInput.trim();
                let parsedCustomData = null;

                if (customDataRaw) {
                    try {
                        parsedCustomData = JSON.parse(customDataRaw);
                    } catch (e) {
                        alert("Invalid JSON in Custom Environment Data. Please fix it before starting the demo.");
                        return;
                    }

                    if (parsedCustomData === null || Array.isArray(parsedCustomData) || typeof parsedCustomData !== "object") {
                        alert("Custom Environment Data must be a JSON object.");
                        return;
                    }
                }

                setView("demo");
                setLogs([{ type: "system", message: `Initializing ${selectedTask}...` }]);
                setIsDone(false);
                setActionInput("");
                setLoading(true);

                try {
                    const resetRequest = { method: "POST" };
                    if (parsedCustomData !== null) {
                        resetRequest.headers = { "Content-Type": "application/json" };
                        resetRequest.body = JSON.stringify(parsedCustomData);
                    }

                    const res = await fetch(`/reset?task_id=${selectedTask}`, resetRequest);
                    if (!res.ok) throw new Error(await res.text());
                    const data = await res.json();

                    setLogs((prev) => [
                        ...prev,
                        { type: "system", message: `--- STARTED ${selectedTask.toUpperCase()} ---` },
                        { type: "env", message: "Initial Observation", data: data.observation }
                    ]);
                } catch (e) {
                    setLogs((prev) => [...prev, { type: "error", message: `Failed to reset: ${e.message}` }]);
                } finally {
                    setLoading(false);
                }
            };

            const submitAction = async () => {
                let parsedAction;
                try {
                    parsedAction = JSON.parse(actionInput);
                } catch (e) {
                    alert("Invalid JSON format! Please correct your payload before submitting.");
                    return;
                }

                setLogs((prev) => [...prev, { type: "agent", message: "Action Submitted:", data: parsedAction }]);
                setLoading(true);

                try {
                    const res = await fetch(`/step`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(parsedAction)
                    });

                    if (!res.ok) throw new Error(await res.text());
                    const data = await res.json();

                    setLogs((prev) => [
                        ...prev,
                        {
                            type: "grader",
                            message: `Reward Received: ${data.reward.value}`,
                            success: data.reward.value > 0,
                            data: data.reward
                        },
                        { type: "env", message: "Next Observation", data: data.observation }
                    ]);

                    if (data.done) {
                        setIsDone(true);
                        setLogs((prev) => [
                            ...prev,
                            { type: "system", message: `--- EPISODE DONE. Cumulative Reward: ${data.info.cumulative_reward} ---` }
                        ]);
                    }
                } catch (e) {
                    setLogs((prev) => [...prev, { type: "error", message: `Step failed: ${e.message}` }]);
                } finally {
                    setLoading(false);
                    setActionInput("");
                }
            };

            const autoFill = () => {
                if (AUTOFILL_SCHEMAS[selectedTask]) {
                    setActionInput(JSON.stringify(AUTOFILL_SCHEMAS[selectedTask], null, 2));
                }
            };

            const renderDashboard = () => (
                <div className="max-w-5xl mx-auto pt-16 px-4">
                    <div className="bg-[#111827] border border-gray-800 rounded-xl p-10 shadow-2xl">
                        <div className="inline-block px-3 py-1 bg-blue-900/50 text-blue-400 text-xs font-bold tracking-wider rounded-full mb-6 border border-blue-800/50">
                            OPENENV AGENT BENCHMARK
                        </div>
                        <h1 className="text-4xl font-extrabold text-white tracking-tight mb-4">InvoiceProcessingEnv</h1>
                        <p className="text-gray-400 text-lg mb-10 max-w-3xl">
                            5-Stage multi-turn simulation testing OCR extraction, UoM Math, Fraud detection, GL Account Coding, and Ledger Reconciliation.
                        </p>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-10">
                            {TASKS.map((task) => (
                                <div
                                    key={task.id}
                                    onClick={() => setSelectedTask(task.id)}
                                    className={`cursor-pointer border rounded-xl p-6 transition-colors ${
                                        selectedTask === task.id
                                            ? "bg-[#1F2937] border-blue-500 ring-1 ring-blue-500"
                                            : "bg-[#1F2937]/50 border-gray-700/50 hover:border-gray-500"
                                    }`}
                                >
                                    <div className="flex items-center gap-3 mb-3">
                                        <h3 className="text-xl font-bold text-white">{task.name}</h3>
                                        <span className="px-2.5 py-0.5 bg-gray-700 text-gray-300 text-xs font-semibold rounded">{task.tag}</span>
                                    </div>
                                    <p className="text-gray-400 text-sm">{task.desc}</p>
                                </div>
                            ))}
                        </div>

                        <div className="mb-10">
                            <label htmlFor="custom-setup" className="block text-sm font-semibold text-gray-300 mb-2">
                                Custom Environment Data (Optional)
                            </label>
                            <p className="text-gray-500 text-sm mb-3">
                                Paste a JSON object to override default observation fields for the selected task.
                            </p>
                            <textarea
                                id="custom-setup"
                                className="w-full min-h-44 bg-[#0B0F19] text-cyan-300 font-mono text-sm p-4 rounded-lg border border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none resize-y"
                                placeholder={"{\n  \"invoice\": {\n    \"id\": \"INV-CUSTOM-1\",\n    \"raw_text\": \"Noisy OCR text here\",\n    \"metadata\": {}\n  }\n}"}
                                value={customSetupInput}
                                onChange={(e) => setCustomSetupInput(e.target.value)}
                            />
                        </div>

                        <div className="flex flex-wrap items-center gap-4 border-t border-gray-800 pt-8">
                            <button onClick={startDemo} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-lg font-bold transition-all shadow-lg shadow-blue-900/20">
                                <i className="ph-fill ph-play"></i> Run Interactive Demo
                            </button>
                            <a href="/docs" className="flex items-center gap-2 bg-[#38BDF8] hover:bg-[#38BDF8]/90 text-gray-900 px-6 py-3 rounded-lg font-bold transition-colors">
                                Swagger UI
                            </a>
                        </div>
                    </div>
                </div>
            );

            const renderDemo = () => (
                <div className="max-w-7xl mx-auto h-[95vh] flex flex-col mt-4 bg-[#111827] border border-gray-800 rounded-xl overflow-hidden shadow-2xl">
                    <div className="flex items-center justify-between px-6 py-4 border-b border-gray-800 bg-[#1F2937]">
                        <div className="flex items-center gap-4">
                            <button onClick={() => setView("dashboard")} className="text-gray-400 hover:text-white flex items-center gap-2 font-medium">
                                <i className="ph ph-arrow-left"></i> Back
                            </button>
                            <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                <i className="ph-fill ph-terminal-window text-blue-400"></i> Simulation: {TASKS.find((t) => t.id === selectedTask)?.name}
                            </h2>
                        </div>
                        <span className="text-sm font-medium px-3 py-1 bg-gray-800 text-gray-300 rounded-full border border-gray-700">
                            Status: {isDone ? "Finished" : "In Progress"}
                        </span>
                    </div>

                    <div className="flex flex-1 overflow-hidden">
                        <div className="flex-1 border-r border-gray-800 flex flex-col bg-[#0B0F19]">
                            <div className="p-4 border-b border-gray-800 bg-[#111827] text-sm font-semibold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                                <i className="ph ph-list-dashes"></i> Environment Stream
                            </div>
                            <div className="flex-1 p-4 overflow-y-auto log-container font-mono text-sm space-y-4">
                                {logs.map((log, i) => (
                                    <div
                                        key={i}
                                        className={`p-4 rounded-lg border ${
                                            log.type === "system" ? "border-gray-700 bg-gray-800/50 text-gray-300" :
                                            log.type === "env" ? "border-blue-900/50 bg-blue-900/10 text-blue-200" :
                                            log.type === "agent" ? "border-purple-900/50 bg-purple-900/10 text-purple-200" :
                                            log.type === "error" ? "border-red-900/50 bg-red-900/10 text-red-400" :
                                            log.success ? "border-green-900/50 bg-green-900/10 text-green-400" : "border-yellow-900/50 bg-yellow-900/10 text-yellow-400"
                                        }`}
                                    >
                                        <div className="flex items-center gap-2 mb-2 font-bold opacity-90 text-sm">
                                            {log.type === "env" && <i className="ph ph-database"></i>}
                                            {log.type === "agent" && <i className="ph ph-robot"></i>}
                                            {log.type === "grader" && (log.success ? <i className="ph ph-check-circle text-green-400"></i> : <i className="ph ph-warning-circle text-yellow-400"></i>)}
                                            {log.message}
                                        </div>
                                        {log.data && (
                                            <pre className="mt-2 text-xs overflow-x-auto p-3 bg-black/50 rounded border border-black/30 text-gray-300">
                                                {JSON.stringify(log.data, null, 2)}
                                            </pre>
                                        )}
                                    </div>
                                ))}
                                <div ref={logsEndRef} />
                            </div>
                        </div>

                        <div className="w-[40%] flex flex-col bg-[#111827]">
                            <div className="p-4 border-b border-gray-800 flex justify-between items-center bg-[#111827]">
                                <span className="text-sm font-semibold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                                    <i className="ph ph-code"></i> Action Payload (JSON)
                                </span>
                                <button
                                    onClick={autoFill}
                                    disabled={isDone || loading}
                                    className="text-xs flex items-center gap-1 bg-purple-900/30 text-purple-400 hover:bg-purple-900/50 px-3 py-1.5 rounded border border-purple-900/50 transition-colors disabled:opacity-50"
                                >
                                    <i className="ph-fill ph-magic-wand"></i> Auto-fill Schema
                                </button>
                            </div>

                            <div className="flex-1 p-4 flex flex-col gap-4">
                                <p className="text-gray-400 text-sm">
                                    Type your JSON action below based on the observation to the left. Hit submit to pass it to the <code>/step</code> endpoint.
                                </p>
                                <textarea
                                    className="flex-1 w-full bg-[#0B0F19] text-green-400 font-mono text-sm p-4 rounded-lg border border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none resize-none"
                                    placeholder={"{\n  // Enter JSON action here\n}"}
                                    value={actionInput}
                                    onChange={(e) => setActionInput(e.target.value)}
                                    disabled={isDone || loading}
                                />

                                <button
                                    onClick={submitAction}
                                    disabled={!actionInput.trim() || isDone || loading}
                                    className="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 disabled:text-gray-500 text-white px-6 py-4 rounded-lg font-bold transition-colors"
                                >
                                    {loading ? "Processing..." : "Submit Action to Env"} <i className="ph-bold ph-caret-right"></i>
                                </button>

                                {isDone && (
                                    <button onClick={startDemo} className="w-full flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-white px-6 py-3 rounded-lg font-semibold transition-colors mt-2 border border-gray-700">
                                        <i className="ph-bold ph-arrow-counter-clockwise"></i> Play Again
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            return view === "dashboard" ? renderDashboard() : renderDemo();
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
