name: invoice-processing-env
version: "1.0.0"
description: >
  A real-world accounts-payable environment testing agentic self-correction.
  Agents process invoices, validate POs, assign GL codes, reconcile statements,
  and detect fraud. Features simulated OCR noise, UoM math, and poison-pill
  distractors. Multi-turn self-correction via directional feedback.
author: openenv-submission
tags:
  - openenv
  - finance
  - invoice-processing
  - gl-coding
  - reconciliation
  - self-correction

environment:
  base_url: http://localhost:7860
  reset_endpoint: /reset
  step_endpoint: /step
  state_endpoint: /state

tasks:
  - id: "task_1"
    name: "Field Extraction"
    description: "Extract 7 structured fields from a noisy OCR invoice. 3 attempts."
    difficulty: easy
    max_steps: 3
    reward_range: [0.0, 1.0]

  - id: "task_2"
    name: "PO Validation"
    description: "Validate an invoice vs PO (UoM math required). Identify 3 mismatches. 3 attempts."
    difficulty: medium
    max_steps: 3
    reward_range: [0.0, 1.0]

  - id: "task_3"
    name: "Fraud Detection"
    description: "Review 5 invoices. Find 3 frauds. Ignore urgent distractors. 3 attempts."
    difficulty: hard
    max_steps: 3
    reward_range: [0.0, 1.0]

  - id: "task_4"
    name: "GL Account Coding"
    description: "Map 4 ambiguous line items to a Chart of Accounts. 3 attempts."
    difficulty: medium
    max_steps: 3
    reward_range: [0.0, 1.0]

  - id: "task_5"
    name: "Statement Reconciliation"
    description: "Cross-reference a Vendor Statement vs Internal Ledger. Find missing/discrepant invoices. 3 attempts."
    difficulty: hard
    max_steps: 3
    reward_range: [0.0, 1.0]

observation_space:
  type: object
  fields:
    task_id: {type: string}
    task_description: {type: string}
    step_number: {type: integer}
    total_steps: {type: integer}
    invoice:
      type: object
      nullable: true
    purchase_order:
      type: object
      nullable: true
    vendor_whitelist:
      type: array
      items: {type: string}
      nullable: true
    batch:
      type: array
      nullable: true
    chart_of_accounts:
      type: object
      nullable: true
    vendor_statement:
      type: string
      nullable: true
    internal_ledger:
      type: array
      nullable: true

action_space:
  type: object
  fields:
    invoice_id:
      type: string
    extracted_fields:
      type: object
      nullable: true
    decision:
      type: string
      nullable: true
    mismatches:
      type: array
      nullable: true
      items: {type: string}
    fraud_flags:
      type: array
      nullable: true
    gl_allocations:
      type: object
      nullable: true
      description: "Task 4: Dict of {line_item_description: gl_code}"
    missing_invoices:
      type: array
      nullable: true
      items: {type: string}
      description: "Task 5: Invoices on statement but not in ledger"
    discrepancy_invoices:
      type: array
      nullable: true
      items: {type: string}
      description: "Task 5: Invoices with amount mismatches"

reward:
  type: float
  range: [0.0, 1.0]
  description: "Delta-based reward. Agent receives reward equal to improvement over its best previous attempt."
