name: invoice-processing-env
version: "1.0.0"
description: >
  A real-world accounts-payable environment testing agentic self-correction.
  Agents process invoices, validate POs, and detect fraud. Features simulated
  OCR noise, UoM math, and poison-pill distractors. If agents make mistakes,
  the environment provides directional feedback, requiring multi-turn self-correction.
author: openenv-submission
tags:
  - openenv
  - finance
  - invoice-processing
  - fraud-detection
  - self-correction
  - agentic-loop

environment:
  base_url: http://localhost:7860
  reset_endpoint: /reset
  step_endpoint: /step
  state_endpoint: /state

tasks:
  - id: "task_1"
    name: "Field Extraction (Self-Correcting)"
    description: >
      Extract 7 structured fields from a noisy OCR invoice.
      You have 3 attempts. If incorrect, the environment will list the failing fields.
    difficulty: easy
    max_steps: 3
    reward_range: [0.0, 1.0]

  - id: "task_2"
    name: "PO Validation (Self-Correcting)"
    description: >
      Validate an invoice vs PO (UoM math required). Identify 3 mismatches.
      You have 3 attempts. Feedback will indicate how many mismatches you successfully found.
    difficulty: medium
    max_steps: 3
    reward_range: [0.0, 1.0]

  - id: "task_3"
    name: "Fraud Detection (Self-Correcting)"
    description: >
      Review a batch of 5 invoices. Find the 3 frauds. Ignore urgent/aggressive distractors.
      You have 3 attempts. Feedback will provide your current Precision and Recall.
    difficulty: hard
    max_steps: 3
    reward_range: [0.0, 1.0]

observation_space:
  type: object
  fields:
    task_id: {type: string}
    task_description: {type: string}
    step_number: {type: integer}
    total_steps: {type: integer}
    invoice:
      type: object
      fields:
        id: {type: string}
        raw_text: {type: string}
        metadata: {type: object}
    purchase_order:
      type: object
      nullable: true
    vendor_whitelist:
      type: array
      items: {type: string}
      nullable: true
    batch:
      type: array
      nullable: true
      description: "List of invoices (task 3 only)"

action_space:
  type: object
  fields:
    invoice_id:
      type: string
    extracted_fields:
      type: object
      nullable: true
    decision:
      type: string
      nullable: true
      enum: [approve, reject, flag_for_review]
    mismatches:
      type: array
      nullable: true
      items: {type: string}
    fraud_flags:
      type: array
      nullable: true

reward:
  type: float
  range: [0.0, 1.0]
  description: >
    Delta-based reward. The agent receives reward equal to the improvement over its best previous attempt.
    Max cumulative reward is strictly 1.0.
